# Static analysis (errors only - the project still has a long tail of lint notes) and the unit/widget tests.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - name: Analyze (fail on errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test

  # A release build catches what analyze and tests cannot: R8 stripping something the app
  # needs, resource shrinking, and manifest merge errors. It is signed with a throwaway key,
  # so the bundle is only a build check and is never uploaded anywhere.
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - name: Throwaway signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" -alias ci -keyalg RSA -keysize 2048 \
            -validity 2 -storepass cipassword -keypass cipassword -dname "CN=CI"
      - name: Build release bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci.jks
          KEY_ALIAS: ci
          KEY_PASSWORD: cipassword
          STORE_PASSWORD: cipassword
        run: flutter build appbundle --release --dart-define=STRIPE_PK=pk_test_ci
