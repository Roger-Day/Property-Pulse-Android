name: property_pulse
description: Property Pulse - Find your perfect property
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.2+3
  cloud_functions: ^5.1.3

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Sign in with Apple
  sign_in_with_apple: ^6.1.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # Networking & Images
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  http: ^1.2.2
  crypto: ^3.0.6

  # Storage
  shared_preferences: ^2.3.2

  # Firebase Performance — mirrors iOS PerformanceMonitoringService + AppPerformanceTracing
  firebase_performance: ^0.10.0+8

  # Connectivity — offline banner, network state monitoring (mirrors iOS .onReconnect)
  connectivity_plus: ^6.1.4

  # UI Utilities
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  photo_view: ^0.15.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.2
  share_plus: ^10.0.2
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Stripe (host bookings / Connect — not used for consumer Premium; see in_app_purchase)
  flutter_stripe: ^11.1.0

  # Play Billing — Premium + listing boosts (same product IDs as iOS StoreKit)
  in_app_purchase: ^3.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # Runtime notification permission (Android 13+) + open system settings
  permission_handler: ^11.3.1

  # Image compression (pure Dart) — iterative JPEG quality before Storage upload.
  # Mirrors iOS jpegDataUnderLimit; avoids native flutter_image_compress resolution issues.
  image: ^4.3.0

  # Voice search — mirrors iOS SpeechRecognitionService (SFSpeechRecognizer)
  speech_to_text: ^7.4.0

  # Local appointment reminders — mirrors iOS NotificationHelper's 1-hour-before
  # local notification (scheduled independently of FCM push).
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── Native splash screen ───────────────────────────────────────────────────────
# Run `dart run flutter_native_splash:create` after editing.
# Replace color / image with your actual brand values.
flutter_native_splash:
  color: "#FFFFFF"
  # image: assets/images/splash_logo.png
  android_gravity: center
  android_12:
    color: "#FFFFFF"
    # image: assets/images/splash_logo.png
    icon_background_color: "#FFFFFF"
  web: false   # web not targeted
