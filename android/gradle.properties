# ── JVM heap ─────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Gradle build performance ──────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true

# ── R8 / Kotlin ───────────────────────────────────────────────────────────────
# Full-mode R8: more aggressive inlining, class merging & dead-code removal.
android.enableR8.fullMode=true

# Incremental Kotlin compilation
kotlin.incremental=true
kotlin.incremental.java=true

# Disable build features your project doesn't use to speed up incremental builds
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ── Suppress warnings ─────────────────────────────────────────────────────────
android.suppressUnsupportedOptionWarnings=android.enableR8.fullMode,android.defaults.buildfeatures.buildconfig,android.defaults.buildfeatures.aidl,android.defaults.buildfeatures.renderscript,android.defaults.buildfeatures.resvalues,android.defaults.buildfeatures.shaders
